<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=402, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
<title>DopaBreak - Lock Notification</title>
<style>
:root{
  --bg:#0A0B0D; --bg2:#101216; --card:#14171C; --ink:#F4F5F2;
  --muted:#7E8694; --line:rgba(255,255,255,.08); --accent:#C7F94D;
  --accent-dim:rgba(199,249,77,.14); --danger:#FF6B5A;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-font-smoothing:antialiased;text-rendering:geometricPrecision;}
html,body{width:402px;height:874px;overflow:hidden;}
body{
  color:var(--ink);
  font-family:'Zen Kaku Gothic New','Space Grotesk',sans-serif;
  /* dark mono lock wallpaper — subtle vertical fog, no color */
  background:linear-gradient(180deg,#15181E 0%,#0B0D11 46%,#050607 100%);
}
.screen{width:402px;height:874px;padding:0 14px;display:flex;flex-direction:column;position:relative;overflow:hidden;}
.screen::before{content:"";position:absolute;inset:0;background:radial-gradient(130% 70% at 50% -8%, rgba(255,255,255,.05), transparent 50%);pointer-events:none;}
.screen>*{position:relative;z-index:1;}

/* status bar */
.status{height:54px;display:flex;align-items:flex-end;justify-content:space-between;padding:0 12px 6px;color:var(--ink);font-family:'Space Grotesk';font-weight:600;font-size:15px;letter-spacing:.02em;flex:0 0 54px;}
.status .r{display:flex;gap:6px;align-items:center;}
.status svg{display:block;color:var(--ink);}

/* clock block */
.lock-top{text-align:center;margin-top:30px;}
.lock-date{font-size:17px;font-weight:500;letter-spacing:.04em;color:rgba(244,245,242,.92);}
.lock-clock{font-family:'Space Grotesk';font-size:82px;font-weight:600;letter-spacing:-.065em;line-height:1;margin-top:4px;}

/* notification card (this is the colorful, full-width, persistent piece) */
.notif{
  margin:auto 6px 150px;
  border-radius:23px;
  background:rgba(20,23,29,.66);
  -webkit-backdrop-filter:blur(30px) saturate(1.05);
  backdrop-filter:blur(30px) saturate(1.05);
  border:1px solid rgba(255,255,255,.10);
  box-shadow:0 24px 70px rgba(0,0,0,.45);
  padding:14px 16px 6px;
}
.notif-head{display:flex;align-items:center;gap:10px;padding:1px 0 11px;}
.notif-icon{width:26px;height:26px;border-radius:8px;background:linear-gradient(160deg,#1B1F26,#0C0E12);border:1px solid rgba(199,249,77,.5);display:flex;align-items:center;justify-content:center;flex:0 0 26px;}
.notif-name{font-size:14px;font-weight:700;letter-spacing:.02em;flex:1;color:var(--ink);}
.notif-time{font-size:12px;color:var(--muted);font-weight:500;margin-right:9px;}
.notif-badge{min-width:22px;height:22px;padding:0 6px;border-radius:999px;background:rgba(255,255,255,.16);color:var(--ink);font-family:'Space Grotesk';font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;}

/* anchored goal line */
.notif-goal{display:flex;align-items:center;gap:9px;padding:11px 1px 12px;border-top:1px solid rgba(255,255,255,.07);}
.notif-goal .dot{width:7px;height:7px;border-radius:50%;background:var(--accent);flex:0 0 7px;box-shadow:0 0 10px rgba(199,249,77,.55);}
.notif-goal .k{font-family:'JetBrains Mono';font-size:10px;letter-spacing:.2em;color:var(--muted);text-transform:uppercase;flex:0 0 auto;}
.notif-goal .v{font-size:14px;font-weight:700;color:var(--ink);letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

/* checkable promises */
.notif-row{display:flex;align-items:center;gap:13px;padding:12px 1px;border-top:1px solid rgba(255,255,255,.07);}
.notif-check{width:23px;height:23px;border-radius:50%;border:1.6px solid rgba(199,249,77,.85);flex:0 0 23px;display:flex;align-items:center;justify-content:center;}
.notif-check.done{background:var(--accent);border-color:var(--accent);}
.notif-text{font-size:15.5px;font-weight:600;letter-spacing:.01em;color:var(--ink);}
.notif-row.done .notif-text{color:var(--muted);text-decoration:line-through;text-decoration-color:rgba(126,134,148,.6);}

/* live metric — the one "alive" number that justifies a Live Activity */
.notif-metric{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:13px 1px 10px;border-top:1px solid rgba(255,255,255,.07);}
.notif-metric .m-text{display:flex;flex-direction:column;gap:6px;}
.notif-metric .m-lab{font-family:'JetBrains Mono';font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:7px;}
.notif-metric .m-lab .dot{width:6px;height:6px;border-radius:50%;background:var(--accent);box-shadow:0 0 9px rgba(199,249,77,.5);}
.notif-metric .m-sub{font-size:12.5px;font-weight:600;color:rgba(244,245,242,.82);letter-spacing:.01em;}
.notif-metric .m-big{font-family:'Space Grotesk';font-weight:700;font-size:35px;line-height:1;letter-spacing:-.035em;color:var(--ink);white-space:nowrap;display:flex;align-items:baseline;}
.notif-metric .m-big small{font-family:'Zen Kaku Gothic New';font-size:14px;font-weight:700;color:var(--muted);margin:0 3px 0 2px;}

/* flashlight / camera */
.lock-icons{position:absolute;left:58px;right:58px;bottom:67px;display:flex;justify-content:space-between;align-items:center;}
.lock-icon{width:52px;height:52px;border-radius:50%;background:rgba(20,23,28,.72);display:flex;align-items:center;justify-content:center;color:var(--ink);}
.home{position:absolute;left:50%;transform:translateX(-50%);bottom:9px;width:134px;height:5px;border-radius:3px;background:rgba(255,255,255,.32);z-index:3;}
</style>
</head>
<body>
<div class="screen">
  <div class="status">
    <span>8:41</span>
    <span class="r">
      <svg width="18" height="12" viewBox="0 0 18 12" aria-hidden="true"><g fill="currentColor"><rect x="0" y="7" width="3" height="5" rx="1"/><rect x="5" y="4" width="3" height="8" rx="1"/><rect x="10" y="1.5" width="3" height="10.5" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></g></svg>
      <svg width="17" height="12" viewBox="0 0 17 12" fill="none" aria-hidden="true"><path d="M8.5 10.5a1.4 1.4 0 100 .01M3 6.2a8 8 0 0111 0M.7 3.4a12 12 0 0115.6 0" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      <svg width="26" height="13" viewBox="0 0 26 13" aria-hidden="true"><rect x="1" y="1" width="21" height="11" rx="3" fill="none" stroke="currentColor" stroke-opacity=".5"/><rect x="3" y="3" width="16" height="7" rx="1.5" fill="currentColor"/><rect x="23.5" y="4.5" width="1.6" height="4" rx="1" fill="currentColor" fill-opacity=".5"/></svg>
    </span>
  </div>

  <div class="lock-top">
    <div class="lock-date">6月29日 月曜日</div>
    <div class="lock-clock">8:41</div>
  </div>

  <section class="notif">
    <div class="notif-head">
      <span class="notif-icon">
        <svg width="15" height="15" viewBox="0 0 16 16" fill="none" aria-hidden="true">
          <path d="M8 1.4a6.6 6.6 0 1 0 4.9 2.2" stroke="#C7F94D" stroke-width="1.7" stroke-linecap="round"/>
          <circle cx="8" cy="8" r="2.1" fill="#C7F94D"/>
        </svg>
      </span>
      <span class="notif-name">DopaBreak</span>
      <span class="notif-time">now</span>
    </div>

    <div class="notif-goal">
      <span class="dot"></span>
      <span class="k">Goal</span>
      <span class="v">英語で商談できる自分になる</span>
    </div>

    <div class="notif-metric">
      <div class="m-text">
        <span class="m-lab"><span class="dot"></span>取り戻した時間 · 今週</span>
        <span class="m-sub">開かずに我慢 142回 · 12日連続</span>
      </div>
      <span class="m-big">6<small>時間</small>20<small>分</small></span>
    </div>
  </section>

  <div class="lock-icons">
    <div class="lock-icon"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M9 2h6v4l-2 2v12a2 2 0 0 1-4 0V8L7 6V2h2Z" fill="currentColor"/></svg></div>
    <div class="lock-icon"><svg width="27" height="24" viewBox="0 0 27 24" fill="none" aria-hidden="true"><path d="M8 7 10 4h7l2 3h3a3 3 0 0 1 3 3v8a3 3 0 0 1-3 3H5a3 3 0 0 1-3-3v-8a3 3 0 0 1 3-3h3Z" fill="currentColor"/><rect x="10" y="11" width="7" height="6" rx="1.5" fill="#0A0B0D"/></svg></div>
  </div>
  <div class="home"></div>
</div>
</body>
</html>
