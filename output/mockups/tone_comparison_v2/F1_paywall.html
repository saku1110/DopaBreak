<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=402, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@400;600;700;800&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
<title>F1 墨と灯 - Paywall</title>
<style>
:root{
  --bg:#0F0D0A;
  --card:#1A1610;
  --ink:#F2EAD9;
  --muted:#9C8E7D;
  --line:rgba(242,234,217,.10);
  --accent:#E4A14E;
  --accent-dim:rgba(228,161,78,.12);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-font-smoothing:antialiased;text-rendering:geometricPrecision;}
html,body{width:402px;height:874px;overflow:hidden;}
body{background:linear-gradient(180deg,#12100C 0%,#0F0D0A 40%,#0C0A08 100%);color:var(--ink);font-family:'Zen Kaku Gothic New',sans-serif;}
.screen{width:402px;height:874px;padding:0 28px;display:flex;flex-direction:column;position:relative;overflow:hidden;}
.status{height:54px;display:flex;align-items:flex-end;justify-content:space-between;padding-bottom:6px;font-family:'Space Grotesk';font-weight:600;font-size:15px;letter-spacing:.02em;flex:0 0 54px;}
.status .r{display:flex;gap:6px;align-items:center;}
.home{position:absolute;left:50%;transform:translateX(-50%);bottom:9px;width:134px;height:5px;border-radius:3px;background:rgba(242,234,217,.28);z-index:3;}
.page{flex:1;display:flex;flex-direction:column;padding-top:14px;}
.tag{font-family:'JetBrains Mono';font-size:10.5px;letter-spacing:.4em;color:var(--muted);text-transform:uppercase;display:flex;align-items:center;gap:12px;}
.tag::after{content:"";height:1px;flex:1;background:var(--line);}
.title{font-family:'Shippori Mincho B1',serif;font-size:33px;line-height:1.42;font-weight:700;letter-spacing:.04em;margin-top:16px;}
.title .num{font-family:'Space Grotesk';color:var(--accent);font-weight:600;letter-spacing:-.02em;}
.benefits{margin-top:16px;}
.benefit{height:42px;display:grid;grid-template-columns:22px 1fr;align-items:center;gap:10px;font-size:14.5px;font-weight:500;letter-spacing:.03em;border-bottom:1px solid var(--line);}
.benefit:last-child{border-bottom:0;}
.benefit .tick{color:var(--accent);font-family:'Space Grotesk';font-weight:700;}
.plans{display:flex;flex-direction:column;gap:9px;margin-top:14px;}
.plan{min-height:58px;padding:10px 15px;border-radius:4px;border:1px solid var(--line);background:rgba(26,22,16,.6);display:flex;align-items:center;justify-content:space-between;}
.plan strong{font-size:15px;letter-spacing:.06em;}
.plan .price{font-family:'Space Grotesk';font-size:18px;font-weight:700;letter-spacing:-.01em;}
.plan .unit{font-size:11.5px;color:var(--muted);font-weight:500;}
.plan .note{color:var(--muted);font-size:11px;margin-top:3px;letter-spacing:.03em;}
.plan.selected{border-color:rgba(228,161,78,.65);background:linear-gradient(180deg,var(--accent-dim),rgba(228,161,78,.04));box-shadow:0 0 0 1px rgba(228,161,78,.2), 0 10px 32px rgba(0,0,0,.3);}
.badge{display:inline-flex;align-items:center;border:1px solid rgba(228,161,78,.5);color:var(--accent);font-family:'JetBrains Mono';font-size:8.5px;letter-spacing:.18em;padding:4px 8px;text-transform:uppercase;border-radius:2px;margin-top:6px;}
.bottom-actions{margin-top:auto;padding-bottom:26px;}
.btn{height:56px;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;letter-spacing:.2em;}
.btn.primary{background:var(--accent);color:#14100A;}
.fine{margin-top:12px;text-align:center;color:var(--muted);font-size:10.5px;line-height:1.6;letter-spacing:.02em;}
</style>
</head>
<body>
<div class="screen">
<div class="status">
  <span>9:41</span>
  <span class="r">
    <svg width="18" height="12" viewBox="0 0 18 12" aria-hidden="true"><g fill="currentColor"><rect x="0" y="7" width="3" height="5" rx="1"/><rect x="5" y="4" width="3" height="8" rx="1"/><rect x="10" y="1.5" width="3" height="10.5" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></g></svg>
    <svg width="17" height="12" viewBox="0 0 17 12" fill="none" aria-hidden="true"><path d="M8.5 10.5a1.4 1.4 0 100 .01M3 6.2a8 8 0 0111 0M.7 3.4a12 12 0 0115.6 0" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
    <svg width="26" height="13" viewBox="0 0 26 13" aria-hidden="true"><rect x="1" y="1" width="21" height="11" rx="3" fill="none" stroke="currentColor" stroke-opacity=".5"/><rect x="3" y="3" width="16" height="7" rx="1.5" fill="currentColor"/><rect x="23.5" y="4.5" width="1.6" height="4" rx="1" fill="currentColor" fill-opacity=".5"/></svg>
  </span>
</div>
<main class="page">
  <div class="tag">Pro</div>
  <h1 class="title">その <span class="num">38</span> 日を<br>人生に使う</h1>
  <section class="benefits">
    <div class="benefit"><span class="tick">─</span><span>守るSNSを何個でも追加</span></div>
    <div class="benefit"><span class="tick">─</span><span>ロック画面に人生の目標</span></div>
    <div class="benefit"><span class="tick">─</span><span>週次「取り戻した時間」レポート</span></div>
    <div class="benefit"><span class="tick">─</span><span>1年の目標と厳格モード</span></div>
  </section>
  <section class="plans">
    <div class="plan"><div><strong>買い切り</strong><div class="note">一回のみ · 期限なし</div></div><span class="price">¥14,800</span></div>
    <div class="plan selected">
      <div><strong>年額</strong><div><span class="badge">7日間無料 · 一番人気 · 47%お得</span></div></div>
      <div style="text-align:right;"><span class="price">¥4,980<span class="unit">/年</span></span><div class="note">¥415/月 相当</div></div>
    </div>
    <div class="plan"><strong>月額</strong><span class="price">¥780<span class="unit">/月</span></span></div>
  </section>
  <div class="bottom-actions">
    <div class="btn primary">7日間無料ではじめる</div>
    <div class="fine">無料期間終了の24時間前までに解約しない場合、7日後に¥4,980/年で自動更新<br>いつでも解約 · 購入を復元 · 利用規約 · プライバシー</div>
  </div>
</main>
<div class="home"></div></div>
</body>
</html>
