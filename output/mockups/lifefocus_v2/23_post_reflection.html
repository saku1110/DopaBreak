<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=402, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
<title>DopaBreak - Post-Use Reflection (S-07)</title>
<style>
:root{
  --bg:#0A0B0D;
  --card:#14171C;
  --ink:#F4F5F2;
  --muted:#7E8694;
  --line:rgba(255,255,255,.08);
  --accent:#C7F94D;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-font-smoothing:antialiased;text-rendering:geometricPrecision;}
html,body{width:402px;height:874px;overflow:hidden;}
body{background:var(--bg);color:var(--ink);font-family:'Zen Kaku Gothic New','Space Grotesk',sans-serif;}
.screen{width:402px;height:874px;padding:0 26px;display:flex;flex-direction:column;position:relative;overflow:hidden;}
.screen::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg, rgba(255,255,255,.035), transparent 34%, rgba(255,255,255,.018));pointer-events:none;}
.screen>*{position:relative;z-index:1;}
.status{height:54px;display:flex;align-items:flex-end;justify-content:space-between;padding-bottom:6px;font-family:'Space Grotesk';font-weight:600;font-size:15px;letter-spacing:.02em;flex:0 0 54px;}
.status .r{display:flex;gap:6px;align-items:center;}
.home{position:absolute;left:50%;transform:translateX(-50%);bottom:9px;width:134px;height:5px;border-radius:3px;background:rgba(255,255,255,.32);z-index:3;}
.tag{font-family:'JetBrains Mono';font-size:11px;letter-spacing:.34em;color:var(--muted);text-transform:uppercase;}
.page{flex:1;display:flex;flex-direction:column;padding-top:18px;}
.title{font-size:30px;line-height:1.22;font-weight:900;letter-spacing:.01em;margin-top:16px;}
.session{margin-top:12px;display:flex;align-items:center;gap:9px;color:var(--muted);font-size:13px;font-weight:700;}
.session .dot{width:6px;height:6px;border-radius:50%;background:var(--accent);}
.session b{font-family:'Space Grotesk';color:var(--ink);font-weight:600;}
.choice-list{display:flex;flex-direction:column;gap:9px;margin-top:20px;}
.choice{height:52px;padding:0 16px;display:flex;align-items:center;justify-content:space-between;background:var(--card);border:1px solid var(--line);border-radius:15px;font-size:15px;font-weight:700;}
.choice .check{width:20px;height:20px;border-radius:50%;border:1px solid rgba(255,255,255,.16);display:flex;align-items:center;justify-content:center;}
.choice.selected{border-color:var(--accent);background:linear-gradient(180deg, rgba(199,249,77,.09), rgba(199,249,77,.025));}
.choice.selected .check{background:var(--accent);border-color:var(--accent);color:#0A0B0D;font-family:'Space Grotesk';font-weight:700;font-size:12px;}
.q2-label{margin-top:22px;font-family:'JetBrains Mono';font-size:10.5px;letter-spacing:.26em;text-transform:uppercase;color:var(--muted);}
.q2{margin-top:6px;font-size:17px;font-weight:900;}
.chips{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:13px;}
.chip{height:46px;border-radius:14px;border:1px solid var(--line);background:var(--card);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;color:var(--muted);}
.chip.selected{border-color:var(--accent);background:rgba(199,249,77,.1);color:var(--accent);}
.note{margin-top:14px;color:var(--muted);font-size:12px;line-height:1.6;}
.bottom-actions{margin-top:auto;padding-bottom:34px;}
.btn{height:56px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:700;letter-spacing:.04em;}
.btn.primary{background:var(--accent);color:#0A0B0D;}
.link-ghost{margin-top:13px;text-align:center;color:var(--muted);font-size:14px;font-weight:500;}
</style>
</head>
<body>
<div class="screen">
<div class="status">
  <span>22:47</span>
  <span class="r">
    <svg width="18" height="12" viewBox="0 0 18 12" aria-hidden="true"><g fill="currentColor"><rect x="0" y="7" width="3" height="5" rx="1"/><rect x="5" y="4" width="3" height="8" rx="1"/><rect x="10" y="1.5" width="3" height="10.5" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></g></svg>
    <svg width="17" height="12" viewBox="0 0 17 12" fill="none" aria-hidden="true"><path d="M8.5 10.5a1.4 1.4 0 100 .01M3 6.2a8 8 0 0111 0M.7 3.4a12 12 0 0115.6 0" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
    <svg width="26" height="13" viewBox="0 0 26 13" aria-hidden="true"><rect x="1" y="1" width="21" height="11" rx="3" fill="none" stroke="currentColor" stroke-opacity=".5"/><rect x="3" y="3" width="16" height="7" rx="1.5" fill="currentColor"/><rect x="23.5" y="4.5" width="1.6" height="4" rx="1" fill="currentColor" fill-opacity=".5"/></svg>
  </span>
</div>
<main class="page">
  <div class="tag">REFLECTION</div>
  <h1 class="title">SNSを見て<br>どうだった？</h1>
  <div class="session"><span class="dot"></span><span>Instagram · <b>5分</b> の利用が終わりました</span></div>
  <div class="choice-list">
    <div class="choice"><span>満足感があった</span><span class="check"></span></div>
    <div class="choice"><span>楽しかった</span><span class="check"></span></div>
    <div class="choice selected"><span>何も得られなかった</span><span class="check">✓</span></div>
    <div class="choice"><span>時間を失った感じがする</span><span class="check"></span></div>
    <div class="choice"><span>気分が下がった</span><span class="check"></span></div>
  </div>
  <div class="q2-label">HAPPINESS / FOCUS</div>
  <div class="q2">幸福感や集中は増えた？</div>
  <div class="chips">
    <div class="chip">増えた</div>
    <div class="chip selected">変わらない</div>
    <div class="chip">減った</div>
  </div>
  <div class="bottom-actions">
    <div class="btn primary">記録する</div>
    <div class="link-ghost">今回はスキップ</div>
  </div>
</main>
<div class="home"></div></div>
</body>
</html>
