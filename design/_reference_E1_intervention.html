<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0A0B0D; --bg2:#101216; --ink:#F4F5F2; --muted:#7E8694;
    --line:rgba(255,255,255,.08); --accent:#C7F94D; --card:#14171C;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-font-smoothing:antialiased;}
  html,body{width:402px;height:874px;}
  body{
    background:radial-gradient(120% 80% at 50% -10%, #15181E 0%, var(--bg) 55%);
    color:var(--ink);
    font-family:'Zen Kaku Gothic New','Space Grotesk',sans-serif;
    overflow:hidden;
  }
  .screen{width:402px;height:874px;padding:0 26px;display:flex;flex-direction:column;position:relative;}
  /* status bar */
  .status{height:54px;display:flex;align-items:flex-end;justify-content:space-between;padding-bottom:6px;font-family:'Space Grotesk';font-weight:600;font-size:15px;letter-spacing:.02em;}
  .status .r{display:flex;gap:6px;align-items:center;}
  .status .r svg{display:block;}
  /* top meta row */
  .meta{display:flex;justify-content:space-between;align-items:center;margin-top:14px;}
  .tag{font-family:'JetBrains Mono';font-size:11px;letter-spacing:.34em;color:var(--muted);text-transform:uppercase;}
  .count{font-family:'JetBrains Mono';font-size:11px;letter-spacing:.12em;color:var(--muted);}
  .count b{color:var(--accent);font-weight:500;}
  /* breath */
  .breath{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:30px;}
  .ring{width:188px;height:188px;position:relative;display:flex;align-items:center;justify-content:center;}
  .ring svg{position:absolute;inset:0;transform:rotate(-90deg);}
  .ring .num{font-family:'Space Grotesk';font-weight:500;font-size:72px;letter-spacing:-.02em;}
  .breath .label{font-size:21px;font-weight:500;letter-spacing:.08em;color:var(--ink);}
  .breath .sub{font-family:'JetBrains Mono';font-size:11px;letter-spacing:.2em;color:var(--muted);margin-top:-16px;}
  /* goal */
  .goal{border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:22px 2px;}
  .goal .k{font-family:'JetBrains Mono';font-size:10.5px;letter-spacing:.32em;color:var(--muted);text-transform:uppercase;display:flex;align-items:center;gap:8px;}
  .goal .k::before{content:"";width:5px;height:5px;background:var(--accent);border-radius:50%;display:inline-block;}
  .goal .v{font-size:25px;font-weight:700;line-height:1.34;margin-top:13px;letter-spacing:.01em;}
  /* footer */
  .foot{padding:24px 0 40px;}
  .q{font-size:14px;color:var(--muted);text-align:center;letter-spacing:.04em;margin-bottom:16px;}
  .btn{height:58px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:700;letter-spacing:.04em;}
  .btn.primary{background:var(--accent);color:#0A0B0D;}
  .btn.ghost{margin-top:11px;background:transparent;border:1px solid var(--line);color:var(--muted);font-weight:500;}
  .home{position:absolute;left:50%;transform:translateX(-50%);bottom:9px;width:134px;height:5px;border-radius:3px;background:rgba(255,255,255,.32);}
</style>
</head>
<body>
  <div class="screen">
    <div class="status">
      <span>9:41</span>
      <span class="r">
        <svg width="18" height="12" viewBox="0 0 18 12"><g fill="#F4F5F2"><rect x="0" y="7" width="3" height="5" rx="1"/><rect x="5" y="4" width="3" height="8" rx="1"/><rect x="10" y="1.5" width="3" height="10.5" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></g></svg>
        <svg width="17" height="12" viewBox="0 0 17 12" fill="none"><path d="M8.5 10.5a1.4 1.4 0 100 .01M3 6.2a8 8 0 0111 0M.7 3.4a12 12 0 0115.6 0" stroke="#F4F5F2" stroke-width="1.5" stroke-linecap="round"/></svg>
        <svg width="26" height="13" viewBox="0 0 26 13"><rect x="1" y="1" width="21" height="11" rx="3" fill="none" stroke="#F4F5F2" stroke-opacity=".5"/><rect x="3" y="3" width="16" height="7" rx="1.5" fill="#F4F5F2"/><rect x="23.5" y="4.5" width="1.6" height="4" rx="1" fill="#F4F5F2" fill-opacity=".5"/></svg>
      </span>
    </div>

    <div class="meta">
      <span class="tag">Intercepted</span>
      <span class="count">X &nbsp;·&nbsp; 今日 <b>18</b> 回目</span>
    </div>

    <div class="breath">
      <div class="ring">
        <svg width="188" height="188" viewBox="0 0 188 188">
          <circle cx="94" cy="94" r="89" fill="none" stroke="rgba(255,255,255,.07)" stroke-width="2"/>
          <circle cx="94" cy="94" r="89" fill="none" stroke="#C7F94D" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="559" stroke-dashoffset="150"/>
        </svg>
        <span class="num">3</span>
      </div>
      <div style="display:flex;flex-direction:column;align-items:center;gap:9px;">
        <span class="label">ひと呼吸おきましょう</span>
        <span class="sub">BREATHE · 3 SEC</span>
      </div>
    </div>

    <div class="goal">
      <div class="k">あなたの目標 / Your goal</div>
      <div class="v">英語で商談できる自分になる</div>
    </div>

    <div class="foot">
      <div class="q">何のために X を開きますか？</div>
      <div class="btn primary">開かない</div>
      <div class="btn ghost">必要な時間だけ開く</div>
    </div>

    <div class="home"></div>
  </div>
</body>
</html>
