name: DopaBreak
options:
  developmentLanguage: ja
  deploymentTarget:
    iOS: "17.0"
  useBaseInternationalization: false
configFiles:
  Debug: Configs/Shared.xcconfig
  Release: Configs/Shared.xcconfig
packages:
  RevenueCat:
    url: https://github.com/RevenueCat/purchases-ios.git
    exactVersion: 5.89.0
  DopaBreakCore:
    path: Packages/DopaBreakCore
settings:
  base:
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    SWIFT_VERSION: "5.0"
targets:
  DopaBreak:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: DopaBreak
        excludes:
          # App Storeスクリーンショット生成専用のため、アプリ本体には同梱しない。
          - Resources/morning-horizon.png
          # 下の明示的なresources build phaseで1回だけ同梱する。
          - Resources/automation-tutorial-ja.mp4
          - Resources/automation-tutorial-en.mp4
          - Resources/automation-tutorial-ko.mp4
          - Resources/launch-animation.mp4
      - path: Shared/ReinterventionShield.swift
      - path: Shared/DailyOpenLimitShield.swift
      - path: DopaBreak/Resources/automation-tutorial-ja.mp4
        buildPhase: resources
      - path: DopaBreak/Resources/automation-tutorial-en.mp4
        buildPhase: resources
      - path: DopaBreak/Resources/automation-tutorial-ko.mp4
        buildPhase: resources
      - path: DopaBreak/Resources/launch-animation.mp4
        buildPhase: resources
      # アプリ内プレビューとWidgetで同一のロック画面テーマViewを共有する。
      - path: WidgetsExtension/LockThemeLiveActivityView.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(DOPABREAK_BUNDLE_PREFIX).app
        # アプリアイコンはAssets.xcassetsのAppIconから取る。
        # カタログは長らく空で除外されていたため、アイコン追加に合わせて取り込みへ戻した。
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: DopaBreak/Info.plist
      properties:
        CFBundleDisplayName: DopaBreak
        CFBundleLocalizations:
          - ja
          - ko
          - en
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleShortVersionString: "1.0.4"
        CFBundleVersion: "14"
        RevenueCatPublicSDKKey: $(REVENUECAT_PUBLIC_SDK_KEY)
        AppleAdsMeasurementEnabled: $(APPLE_ADS_MEASUREMENT_ENABLED)
        # 独自暗号なし。計測SDKの通信もOS提供のHTTPSを使用する。
        ITSAppUsesNonExemptEncryption: false
        NSSupportsLiveActivities: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # AVPictureInPictureControllerで、ユーザーが見ている設定動画をShortcuts上でも
        # PiP継続するために必要。ガイドを閉じると再生を止め、隠れた常時再生には使わない。
        UIBackgroundModes:
          - audio
        UILaunchScreen:
          # E1 Dark Mono / DesignTokens.background = #0B0D0F。画像・ロゴなしの単色起動面。
          UIColorName: LaunchBackground
        CFBundleURLTypes:
          - CFBundleURLName: $(PRODUCT_BUNDLE_IDENTIFIER)
            CFBundleURLSchemes:
              - dopabreak
    entitlements:
      path: DopaBreak/DopaBreak.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.dopabreak.shared
        com.apple.developer.family-controls: true
    dependencies:
      - package: RevenueCat
        product: RevenueCat
      - sdk: AdServices.framework
      - package: DopaBreakCore
      - target: ShieldConfigExtension
        embed: true
      - target: ShieldActionExtension
        embed: true
      - target: MonitorExtension
        embed: true
      - target: WidgetsExtension
        embed: true
    scheme:
      storeKitConfiguration: ../DopaBreak/DopaBreak.storekit
      testTargets:
        - DopaBreakTests

  DopaBreakTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: DopaBreakTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: DopaBreak
      - package: DopaBreakCore

  ShieldConfigExtension:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: ShieldConfigExtension
      - path: Shared/ReinterventionShield.swift
      - path: Shared/DailyOpenLimitShield.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(DOPABREAK_BUNDLE_PREFIX).app.shieldconfig
    info:
      path: ShieldConfigExtension/Info.plist
      properties:
        CFBundleDisplayName: ShieldConfigExtension
        CFBundleLocalizations:
          - ja
          - ko
          - en
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleShortVersionString: "1.0.4"
        CFBundleVersion: "14"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.ManagedSettingsUI.shield-configuration-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShieldConfigurationExtension
    entitlements:
      path: ShieldConfigExtension/ShieldConfigExtension.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.dopabreak.shared
        com.apple.developer.family-controls: true
    dependencies:
      - package: DopaBreakCore

  ShieldActionExtension:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: ShieldActionExtension
      - path: Shared/ReinterventionShield.swift
      - path: Shared/DailyOpenLimitShield.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(DOPABREAK_BUNDLE_PREFIX).app.shieldaction
    info:
      path: ShieldActionExtension/Info.plist
      properties:
        CFBundleDisplayName: ShieldActionExtension
        CFBundleLocalizations:
          - ja
          - ko
          - en
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleShortVersionString: "1.0.4"
        CFBundleVersion: "14"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.ManagedSettings.shield-action-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShieldActionExtension
    entitlements:
      path: ShieldActionExtension/ShieldActionExtension.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.dopabreak.shared
        com.apple.developer.family-controls: true
    dependencies:
      - package: DopaBreakCore

  MonitorExtension:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: MonitorExtension
      - path: Shared/ReinterventionShield.swift
      - path: Shared/DailyOpenLimitShield.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(DOPABREAK_BUNDLE_PREFIX).app.monitor
    info:
      path: MonitorExtension/Info.plist
      properties:
        CFBundleDisplayName: MonitorExtension
        CFBundleLocalizations:
          - ja
          - ko
          - en
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleShortVersionString: "1.0.4"
        CFBundleVersion: "14"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.deviceactivity.monitor-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).DeviceActivityMonitorExtension
    entitlements:
      path: MonitorExtension/MonitorExtension.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.dopabreak.shared
        com.apple.developer.family-controls: true
    dependencies:
      - package: DopaBreakCore

  WidgetsExtension:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: WidgetsExtension
      # Live Activityを描画するシステムプロセスが解決できるよう、フォントは
      # 親アプリへ複製せずWidget Extensionだけに1コピー同梱する。
      - path: Packages/DopaBreakCore/Sources/DopaBreakCore/Resources/Fonts/DotGothic16.ttf
        buildPhase: resources
      - path: Packages/DopaBreakCore/Sources/DopaBreakCore/Resources/Fonts/ZenKurenaido.ttf
        buildPhase: resources
      - path: Packages/DopaBreakCore/Sources/DopaBreakCore/Resources/Fonts/Galmuri11.ttf
        buildPhase: resources
      - path: Packages/DopaBreakCore/Sources/DopaBreakCore/Resources/Fonts/NanumPenScript.ttf
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(DOPABREAK_BUNDLE_PREFIX).app.widgets
    info:
      path: WidgetsExtension/Info.plist
      properties:
        CFBundleDisplayName: WidgetsExtension
        CFBundleLocalizations:
          - ja
          - ko
          - en
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleShortVersionString: "1.0.4"
        CFBundleVersion: "14"
        UIAppFonts:
          - DotGothic16.ttf
          - ZenKurenaido.ttf
          - Galmuri11.ttf
          - NanumPenScript.ttf
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: WidgetsExtension/WidgetsExtension.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.dopabreak.shared
    dependencies:
      - package: DopaBreakCore

# Sandbox実機検証用スキーム（storeKitConfiguration なし）。
# 既定の DopaBreak スキームは DopaBreak.storekit（ローカルStoreKitテスト環境）に紐づくため、
# そのまま実機で購入しても Apple Sandbox には到達せず証跡にならない。実機の課金検証は必ずこちらで行う。
schemes:
  DopaBreak-Sandbox:
    build:
      targets:
        DopaBreak: all
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
