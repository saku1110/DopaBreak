<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live Activityテーマ 実装済み7種プレビュー</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif;
    background: #1a1a1e;
    color: #eee;
    padding: 32px 24px 64px;
  }
  h1 { font-size: 20px; margin-bottom: 4px; }
  .note { font-size: 12px; color: #999; margin-bottom: 28px; line-height: 1.6; }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
    gap: 24px;
  }
  .tile { border-radius: 16px; overflow: hidden; border: 1px solid #333; }
  .tile-head {
    padding: 10px 16px;
    background: #26262b;
    display: flex; justify-content: space-between; align-items: baseline;
  }
  .tile-head .name { font-size: 14px; font-weight: 700; }
  .tile-head .tier { font-size: 11px; color: #9a9aa2; }
  .screen { padding: 28px 20px 32px; }
  .card {
    border-radius: 18px;
    padding: 16px 16px 16px 19px;
    position: relative;
    overflow: hidden;
  }
  .card .bar { position: absolute; left: 0; top: 0; bottom: 0; width: 3px; }
  .eyebrow {
    font-size: 10px; font-weight: 700; letter-spacing: 0.14em;
    margin-bottom: 10px;
  }
  .goal {
    display: flex; align-items: center; gap: 8px;
    font-size: 15px; font-weight: 700;
    margin-bottom: 5px;
  }
  .tick { width: 10px; height: 2px; flex: none; }
  .divider { height: 1px; margin: 10px 0; }
  .stats { display: flex; gap: 14px; font-size: 12px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .hex { padding: 8px 16px 14px; background: #26262b; font-size: 10px; color: #8a8a92; font-family: ui-monospace, monospace; line-height: 1.7; }
  .sw { display: inline-block; width: 9px; height: 9px; border-radius: 2px; vertical-align: -1px; margin-right: 3px; border: 1px solid rgba(255,255,255,.2); }
</style>
</head>
<body>
<h1>Live Activityテーマ 実装済み7種</h1>
<p class="note">現行実装（DopaBreakWidgets.swift のLive Activity本体レイアウト）を LockTheme の実装カラー値で再現したプレビュー。文言はxcstringsの実装値。森林のみモック未承認の暫定パレット。</p>
<div class="grid" id="grid"></div>
<script>
const themes = [
  { name: "E1", tier: "Free 既定", bg: "#0B0D0F", card: "#14171B", p: "#F4F2EC", s: "#8B929E", a: "#B8FF3D" },
  { name: "墨と灯", tier: "Pro", bg: "#0E0C09", card: "#1D1812", p: "#F7F0E1", s: "#ABA08F", a: "#E59E46" },
  { name: "朝霧", tier: "Pro", bg: "#E8EDF2", card: "#FAFBFC", p: "#1F252F", s: "#5B6977", a: "#5B7E99" },
  { name: "森林", tier: "Pro 暫定パレット", bg: "#08130F", card: "#0F251D", p: "#EEF6F0", s: "#8BA495", a: "#77D28B" },
  { name: "夜更け", tier: "Pro", bg: "#050A16", card: "#0D1F3A", p: "#EBEFFF", s: "#9FABCA", a: "#CAD5FF" },
  { name: "K-POP", tier: "Pro", bg: "#E1CDF7", card: "#F9F6FB", p: "#231F26", s: "#685E6C", a: "#EE3489", goal1: "韓国語で推しと話せる自分になる" },
  { name: "かわいいピンク", tier: "Pro", bg: "#FFDCE5", card: "#FFFDFD", p: "#442B31", s: "#8B5B66", a: "#F25E89" },
];
const grid = document.getElementById("grid");
for (const t of themes) {
  const goal1 = t.goal1 || "英語で商談できる自分になる";
  const el = document.createElement("div");
  el.className = "tile";
  el.innerHTML = `
    <div class="tile-head"><span class="name">${t.name}</span><span class="tier">${t.tier}</span></div>
    <div class="screen" style="background:${t.bg}">
      <div class="card" style="background:${t.card}">
        <div class="bar" style="background:${t.a}"></div>
        <div class="eyebrow" style="color:${t.s}">あなたの目標</div>
        <div class="goal" style="color:${t.p}"><span class="tick" style="background:${t.a}"></span>${goal1}</div>
        <div class="goal" style="color:${t.p}"><span class="tick" style="background:${t.a}"></span>23時までに寝る</div>
        <div class="divider" style="background:${t.s}40"></div>
        <div class="stats">
          <span style="color:${t.a}">今日 開かなかった 8回</span>
          <span style="color:${t.s}">開こうとした 11回</span>
        </div>
      </div>
    </div>
    <div class="hex">
      <span class="sw" style="background:${t.bg}"></span>背景 ${t.bg}
      <span class="sw" style="background:${t.card};margin-left:8px"></span>カード ${t.card}
      <span class="sw" style="background:${t.a};margin-left:8px"></span>アクセント ${t.a}<br>
      <span class="sw" style="background:${t.p}"></span>主文字 ${t.p}
      <span class="sw" style="background:${t.s};margin-left:8px"></span>補助文字 ${t.s}
    </div>`;
  grid.appendChild(el);
}
</script>
</body>
</html>
